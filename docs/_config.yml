# Jekyll config for GitHub Pages.
#
# url:/baseurl: below are already set for the live deployment at
# https://agenticforze.github.io/AI-Regenesis/ — no placeholder find/replace needed for the current setup.
#
# When you buy your domain (ai-regenesis.ai or similar), switch over by:
#   1. Adding a file docs/CNAME containing just your domain, e.g.: ai-regenesis.ai
#   2. Changing `url:` below to https://ai-regenesis.ai (or your domain) and removing the `baseurl:` line
#   3. Configuring the domain's DNS per GitHub's custom-domain instructions
# Until then, this builds correctly at https://agenticforze.github.io/AI-Regenesis/

title: "AI-Regenesis"
description: >-
  The reference architecture library for agentic AI — 60 real use cases across Telecom, BSS/OSS, and
  Financial Services, each mapped through the Regenerative Agentic Architecture Framework (8-layer model),
  with honest retrospectives included. Created by Naga Gande.
url: "https://agenticforze.github.io"
baseurl: "/AI-Regenesis"
author: "Naga Gande"
twitter:
  card: summary_large_image
logo: /favicon.svg
image: /og-image.png

# GitHub Pages whitelisted plugins — both work with zero extra setup, no Ruby/gems needed locally.
# jekyll-seo-tag: auto-generates <title>, meta description, canonical URL, Open Graph, and Twitter Card tags
#                 from each page's front matter (used via {% seo %} in _layouts/default.html)
# jekyll-sitemap: auto-generates /sitemap.xml listing every page at build time — nothing to maintain by hand
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown / build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

