<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="alternate icon" href="{{ '/favicon.svg' | relative_url }}">
<!--
  Analytics — not wired up yet (Phase 0 quick-start item, still open). To activate:
    1. Sign up for Plausible (or swap this for GA4) and get your site's domain registered there.
    2. Uncomment the script tag below and replace YOUR-DOMAIN with the domain this site is served from
       (e.g. ai-regenesis.ai, or YOUR-GITHUB-USERNAME.github.io if not on a custom domain yet).
    3. That's it — page views track automatically. Download-click tracking (below) piggybacks on the same
       `plausible` function once this is live; no extra work needed for that part.

  <script defer data-domain="YOUR-DOMAIN" src="https://plausible.io/js/script.js"></script>
-->
{% seo %}
<style>
  :root{
    --bg: #0B0E13;
    --surface: #12161E;
    --surface-2: #191F2A;
    --line: #262E3D;
    --text: #E7ECF3;
    --text-dim: #8B96A8;
    --telecom: #2FD3C7;
    --telecom-dim: #12403C;
    --finance: #E8B23C;
    --finance-dim: #40340F;
    --bssoss: #FF7A66;
    --bssoss-dim: #431F17;
    --accent: #8C7CFF;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.65;
  }
  .page-wrap{max-width:900px; margin:0 auto; padding:28px 20px 80px;}
  .site-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:10;
  }
  .site-header a.brand{
    color:var(--text); text-decoration:none; font-weight:700; font-size:15px; letter-spacing:.01em;
    display:inline-flex; align-items:center; gap:8px;
  }
  .site-header a.brand img{width:22px; height:22px; border-radius:6px; background:none; padding:0; max-width:none;}
  .site-header a.brand .brand-text{color:var(--text);}
  .site-header a.brand .brand-accent{color:var(--accent);}
  .site-header nav a{
    color:var(--text-dim); text-decoration:none; font-size:13px; margin-left:18px;
  }
  .site-header nav a:hover{color:var(--text);}
  h1,h2,h3{color:var(--text); line-height:1.3;}
  h1{font-size:26px; margin-bottom:6px;}
  h2{font-size:19px; margin-top:34px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  h3{font-size:15px; color:var(--accent);}
  p{color:#CDD5E0;}
  a{color:var(--accent);}
  code, pre{font-family:var(--mono); background:var(--surface-2); border-radius:4px;}
  code{padding:2px 6px; font-size:13px;}
  pre{padding:14px; overflow-x:auto; border:1px solid var(--line);}
  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:13.5px;}
  th{
    text-align:left; color:var(--text-dim); font-family:var(--mono); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.05em; padding:8px; border-bottom:1px solid var(--line);
  }
  td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top; color:#CDD5E0;}
  img{max-width:100%; height:auto; border-radius:8px; background:#fff; padding:8px;}
  blockquote{
    margin:16px 0; padding:12px 16px; background:var(--surface-2); border-left:3px solid var(--accent);
    border-radius:6px; color:var(--text-dim); font-size:14px;
  }
  hr{border:none; border-top:1px solid var(--line); margin:32px 0;}
  .site-footer{
    max-width:900px; margin:0 auto; padding:24px 20px 60px; color:var(--text-dim); font-size:12.5px;
    border-top:1px solid var(--line); margin-top:40px;
  }
  .site-footer a{color:var(--text-dim);}
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/favicon.svg' | relative_url }}" alt=""><span class="brand-text">AI-<span class="brand-accent">Regenesis</span></span></a>
    <nav>
      <a href="{{ '/' | relative_url }}">Browse the catalog</a>
      <a href="{{ '/build/' | relative_url }}">Build Your Own</a>
      <a href="{{ '/deep8/' | relative_url }}">Deep 8-Layer</a>
      <a href="{{ '/skills/' | relative_url }}">Skills (free)</a>
    </nav>
  </header>
  <div class="page-wrap">
    {{ content }}
  </div>
  <script>
    // Fires a Plausible custom event for every skill/pack download click, IF Plausible is loaded (see the
    // commented snippet in <head> above). No-ops silently otherwise — download links work identically with
    // or without analytics configured, this is purely additive instrumentation.
    document.addEventListener('click', function (e) {
      var el = e.target.closest('.download-link');
      if (!el || typeof window.plausible !== 'function') return;
      window.plausible('Download', { props: { item: el.dataset.download || el.href } });
    });
  </script>
  <footer class="site-footer">
    AI-Regenesis — the reference architecture library for agentic AI. Created by Naga Gande. Content licensed
    <a href="{{ site.github.repository_url }}/blob/main/CONTENT-LICENSE.md">CC BY-NC 4.0</a>, code licensed
    <a href="{{ site.github.repository_url }}/blob/main/LICENSE">MIT</a>.
  </footer>
</body>
</html>
