<text x="68" y="338.0" font-size="14.5" font-weight="700" fill="#4A2E7A">End-to-End</text>
<text x="68" y="359.0" font-size="14.5" font-weight="700" fill="#4A2E7A">Observability</text>
<text x="20" y="385.0" font-size="11.5" fill="#6B7280">The Watchdog — monitors data health in</text>
<text x="20" y="402.0" font-size="11.5" fill="#6B7280">real time and sounds the alarm on bias</text>
<text x="20" y="419.0" font-size="11.5" fill="#6B7280">or drift.</text>
<text x="418" y="340.0" font-size="12" fill="#374151">Leakage Recurrence Monitor; Data Quality Watchdog;</text>
<text x="418" y="357.0" font-size="12" fill="#374151">Correction Auditor.</text>
<text x="938" y="340.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">Statistical drift/anomaly detection service</text>
<text x="938" y="357.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">(e.g., Evidently AI)</text>
