<text x="418" y="750.0" font-size="12" fill="#374151">Reconciliation Agent; Discount Misapplication Agent; Un-</text>
<text x="418" y="767.0" font-size="12" fill="#374151">activated Service Agent; Rating Config Drift Agent.</text>
<text x="938" y="733.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">LangGraph on Temporal for durable, at-scale</text>
<text x="938" y="750.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">execution</text>
