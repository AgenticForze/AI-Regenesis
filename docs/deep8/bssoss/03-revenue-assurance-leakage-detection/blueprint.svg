<text x="418" y="95.0" font-size="12" fill="#374151">Retraining Trigger; Policy Memory Updater.</text>
<text x="938" y="78.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">Prefect/Airflow orchestrating scheduled</text>
<text x="938" y="95.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">retraining jobs</text>
