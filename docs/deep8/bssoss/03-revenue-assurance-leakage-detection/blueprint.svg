<text x="68" y="469.0" font-size="14.5" font-weight="700" fill="#7A4E12">Execution &amp;</text>
<text x="68" y="490.0" font-size="14.5" font-weight="700" fill="#7A4E12">Interaction</text>
<text x="20" y="516.0" font-size="11.5" fill="#6B7280">The Hands — turns the digital choice</text>
<text x="20" y="533.0" font-size="11.5" fill="#6B7280">into a real-world task: a system</text>
<text x="20" y="550.0" font-size="11.5" fill="#6B7280">update, a message, a human ask.</text>
<text x="418" y="471.0" font-size="12" fill="#374151">Finance Review Queue; Automated Re-billing Trigger; Systemic</text>
<text x="418" y="488.0" font-size="12" fill="#374151">Root-Cause Ticket; Low-Confidence Hold Queue.</text>
<text x="938" y="471.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">Real system API behind a common tool-calling</text>
<text x="938" y="488.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">interface</text>
