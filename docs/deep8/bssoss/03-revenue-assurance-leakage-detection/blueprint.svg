<text x="68" y="76.0" font-size="14.5" font-weight="700" fill="#333B4A">Feedback &amp;</text>
<text x="68" y="97.0" font-size="14.5" font-weight="700" fill="#333B4A">Reinforcement Loops</text>
<text x="20" y="123.0" font-size="11.5" fill="#6B7280">The Learner — reviews results, catches</text>
