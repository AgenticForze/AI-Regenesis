<text x="20" y="288.0" font-size="11.5" fill="#6B7280">oversight.</text>
<text x="418" y="209.0" font-size="12" fill="#374151">Recovered Revenue Dashboard; At-Risk Revenue Scorecard;</text>
<text x="418" y="226.0" font-size="12" fill="#374151">Leakage-by-Root-Cause View.</text>
<text x="938" y="209.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">BI dashboard (Looker/Tableau) wired to a</text>
<text x="938" y="226.0" font-size="11.5" font-family="&#39;IBM Plex Mono&#39;,monospace" fill="#3E6D93">data warehouse</text>
