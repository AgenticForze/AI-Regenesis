<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 932" font-family="'Inter','IBM Plex Sans',-apple-system,sans-serif">
<rect width="1340" height="932" fill="#FFFFFF"/>
<rect x="0" y="0" width="1340" height="50" fill="#F4F5F7"/>
<text x="200.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700" fill="#333B4A">Reference Blueprint (Manuscript Model)</text>
<text x="660.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700" fill="#333B4A">Use Case Blueprint — Architecture &amp; Solution</text>
<text x="1130.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700" fill="#333B4A">Tools &amp; Technologies</text>
<line x1="0" y1="50" x2="1340" y2="50" stroke="#D8DCE2" stroke-width="1.5"/>
<line x1="400" y1="0" x2="400" y2="932" stroke="#E2E5EA" stroke-width="1"/>
<line x1="920" y1="0" x2="920" y2="932" stroke="#E2E5EA" stroke-width="1"/>
<rect x="0" y="50.0" width="1340" height="110.0" fill="#FFFFFF"/>
<rect x="0" y="50.0" width="5" height="110.0" fill="#AEB4C0"/>
<circle cx="38" cy="80.0" r="18" fill="#EDEFF3" stroke="#AEB4C0" stroke-width="1.5"/>
<text x="38" y="85.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#333B4A">L8</text>
<text x="68" y="76.0" font-size="14.5" font-weight="700" fill="#333B4A">Self-Healing Loop</text>
<text x="20" y="102.0" font-size="11.5" fill="#6B7280">The Learner — reviews results, catches</text>
<text x="20" y="119.0" font-size="11.5" fill="#6B7280">mistakes, and automatically retrains</text>
<text x="20" y="136.0" font-size="11.5" fill="#6B7280">the system to improve over time.</text>
<text x="418" y="78.0" font-size="12" fill="#374151">Outcome Tracker compares predicted vs. actual retention</text>
<text x="418" y="95.0" font-size="12" fill="#374151">outcomes; Model Retraining Trigger fires on performance-</text>
<text x="418" y="112.0" font-size="12" fill="#374151">degradation thresholds; Memory &amp; Policy Updater writes new</text>
<text x="418" y="129.0" font-size="12" fill="#374151">rules back into L3.</text>
<text x="938" y="78.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">Automated retraining pipeline · performance-</text>
<text x="938" y="95.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">threshold monitors · versioned policy store</text>
<line x1="0" y1="160.0" x2="1340" y2="160.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="160.0" width="1340" height="110.0" fill="#FBFBFA"/>
<rect x="0" y="160.0" width="5" height="110.0" fill="#D9748C"/>
<circle cx="38" cy="190.0" r="18" fill="#FBE1E6" stroke="#D9748C" stroke-width="1.5"/>
<text x="38" y="195.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7A2B3F">L7</text>
<text x="68" y="186.0" font-size="14.5" font-weight="700" fill="#7A2B3F">Leadership Portal</text>
<text x="20" y="212.0" font-size="11.5" fill="#6B7280">The Scorecard — links AI actions to</text>
<text x="20" y="229.0" font-size="11.5" fill="#6B7280">dollars, ROI, and ethics for executive</text>
<text x="20" y="246.0" font-size="11.5" fill="#6B7280">oversight.</text>
<text x="418" y="188.0" font-size="12" fill="#374151">Executive ROI Dashboard, Ethics &amp; Fairness Scorecard, and</text>
<text x="418" y="205.0" font-size="12" fill="#374151">Capital Allocation View give the CFO/CRO/CCO a real-time</text>
<text x="418" y="222.0" font-size="12" fill="#374151">link between retention spend and saved revenue.</text>
<text x="938" y="188.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">BI dashboard (Looker/Tableau) wired directly</text>
<text x="938" y="205.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">to outcome and financial data</text>
<line x1="0" y1="270.0" x2="1340" y2="270.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="270.0" width="1340" height="110.0" fill="#FFFFFF"/>
<rect x="0" y="270.0" width="5" height="110.0" fill="#9575CD"/>
<circle cx="38" cy="300.0" r="18" fill="#EAE1F8" stroke="#9575CD" stroke-width="1.5"/>
<text x="38" y="305.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4A2E7A">L6</text>
<text x="68" y="296.0" font-size="14.5" font-weight="700" fill="#4A2E7A">Nervous System</text>
<text x="20" y="322.0" font-size="11.5" fill="#6B7280">The Watchdog — monitors data health in</text>
<text x="20" y="339.0" font-size="11.5" fill="#6B7280">real time and sounds the alarm on bias</text>
<text x="20" y="356.0" font-size="11.5" fill="#6B7280">or drift.</text>
<text x="418" y="298.0" font-size="12" fill="#374151">Drift &amp; Bias Monitor, Data Quality Watchdog, and a Circuit</text>
<text x="418" y="315.0" font-size="12" fill="#374151">Breaker that can auto-pause the campaign the moment</text>
<text x="418" y="332.0" font-size="12" fill="#374151">thresholds are breached.</text>
<text x="938" y="298.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">Statistical drift/bias detection · automated</text>
<text x="938" y="315.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">circuit-breaker service</text>
<line x1="0" y1="380.0" x2="1340" y2="380.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="380.0" width="1340" height="110.0" fill="#FBFBFA"/>
<rect x="0" y="380.0" width="5" height="110.0" fill="#D89A3F"/>
<circle cx="38" cy="410.0" r="18" fill="#FBE8CE" stroke="#D89A3F" stroke-width="1.5"/>
<text x="38" y="415.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7A4E12">L5</text>
<text x="68" y="406.0" font-size="14.5" font-weight="700" fill="#7A4E12">Action Layer</text>
<text x="20" y="432.0" font-size="11.5" fill="#6B7280">The Hands — turns the digital choice</text>
<text x="20" y="449.0" font-size="11.5" fill="#6B7280">into a real-world task: an email, a</text>
<text x="20" y="466.0" font-size="11.5" fill="#6B7280">CRM update, a human ask.</text>
<text x="418" y="408.0" font-size="12" fill="#374151">Tool Registry (CRM offer-dispatch, billing adjustment,</text>
<text x="418" y="425.0" font-size="12" fill="#374151">notification gateway APIs), a human approval gate, and a</text>
<text x="418" y="442.0" font-size="12" fill="#374151">hold/escalate queue for the three conditional routes.</text>
<text x="938" y="408.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">CRM / billing / notification APIs behind a</text>
<text x="938" y="425.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">common tool-calling interface</text>
<line x1="0" y1="490.0" x2="1340" y2="490.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="490.0" width="1340" height="110.0" fill="#FFFFFF"/>
<rect x="0" y="490.0" width="5" height="110.0" fill="#5B93C9"/>
<circle cx="38" cy="520.0" r="18" fill="#DCEBFB" stroke="#5B93C9" stroke-width="1.5"/>
<text x="38" y="525.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1C4A73">L4</text>
<text x="68" y="516.0" font-size="14.5" font-weight="700" fill="#1C4A73">The Conscience</text>
<text x="20" y="542.0" font-size="11.5" fill="#6B7280">The Rulebook — keeps the AI within</text>
<text x="20" y="559.0" font-size="11.5" fill="#6B7280">business, ethical, and regulatory</text>
<text x="20" y="576.0" font-size="11.5" fill="#6B7280">guardrails.</text>
<text x="418" y="518.0" font-size="12" fill="#374151">Discount &amp; Margin Policy Engine, Fairness &amp; Non-</text>
<text x="418" y="535.0" font-size="12" fill="#374151">Discrimination Guardrail, and a Regulatory Constraint Engine</text>
<text x="418" y="552.0" font-size="12" fill="#374151">gate every decision before it can reach the Action Layer.</text>
<text x="938" y="518.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">Rules engine · fairness-testing library ·</text>
<text x="938" y="535.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">regulatory rules engine</text>
<line x1="0" y1="600.0" x2="1340" y2="600.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="600.0" width="1340" height="110.0" fill="#FBFBFA"/>
<rect x="0" y="600.0" width="5" height="110.0" fill="#4FAE83"/>
<circle cx="38" cy="630.0" r="18" fill="#DBF2E7" stroke="#4FAE83" stroke-width="1.5"/>
<text x="38" y="635.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B5E3D">L3</text>
<text x="68" y="626.0" font-size="14.5" font-weight="700" fill="#1B5E3D">Thinking Center</text>
<text x="20" y="652.0" font-size="11.5" fill="#6B7280">The Logic Engine — where agents</text>
<text x="20" y="669.0" font-size="11.5" fill="#6B7280">reason, remember past context, and</text>
<text x="20" y="686.0" font-size="11.5" fill="#6B7280">talk to each other.</text>
<text x="418" y="628.0" font-size="12" fill="#374151">Agent Plane (Planner, Execution Manager, Reflection Engine,</text>
<text x="418" y="645.0" font-size="12" fill="#374151">Confidence Scorer) plus the four-part Memory Layer: Working,</text>
<text x="418" y="662.0" font-size="12" fill="#374151">Episodic, Semantic, and Policy Memory.</text>
<text x="938" y="628.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">Planner/execution/reflection agent loop ·</text>
<text x="938" y="645.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">vector DB for episodic &amp; semantic memory ·</text>
<text x="938" y="662.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">versioned rules store for policy memory</text>
<line x1="0" y1="710.0" x2="1340" y2="710.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="710.0" width="1340" height="110.0" fill="#FFFFFF"/>
<rect x="0" y="710.0" width="5" height="110.0" fill="#5FA3C0"/>
<circle cx="38" cy="740.0" r="18" fill="#E4F0F6" stroke="#5FA3C0" stroke-width="1.5"/>
<text x="38" y="745.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1D4E5F">L2</text>
<text x="68" y="736.0" font-size="14.5" font-weight="700" fill="#1D4E5F">The Brain</text>
<text x="20" y="762.0" font-size="11.5" fill="#6B7280">The Intelligence — core AI power</text>
<text x="20" y="779.0" font-size="11.5" fill="#6B7280">(LLMs) and specialized knowledge</text>
<text x="20" y="796.0" font-size="11.5" fill="#6B7280">graphs.</text>
<text x="418" y="738.0" font-size="12" fill="#374151">AI Gateway fronting the LLM reasoning core and a churn /</text>
<text x="418" y="755.0" font-size="12" fill="#374151">customer knowledge graph.</text>
<text x="938" y="738.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">Claude via a model-routing gateway · graph</text>
<text x="938" y="755.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">database (Neo4j)</text>
<line x1="0" y1="820.0" x2="1340" y2="820.0" stroke="#EDEEF1" stroke-width="1"/>
<rect x="0" y="820.0" width="1340" height="110.0" fill="#FBFBFA"/>
<rect x="0" y="820.0" width="5" height="110.0" fill="#C7BC9E"/>
<circle cx="38" cy="850.0" r="18" fill="#F2EEE3" stroke="#C7BC9E" stroke-width="1.5"/>
<text x="38" y="855.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4A4432">L1</text>
<text x="68" y="846.0" font-size="14.5" font-weight="700" fill="#4A4432">The Base</text>
<text x="20" y="872.0" font-size="11.5" fill="#6B7280">The Foundation — secure cloud,</text>
<text x="20" y="889.0" font-size="11.5" fill="#6B7280">databases, and the raw data everything</text>
<text x="20" y="906.0" font-size="11.5" fill="#6B7280">else sits on.</text>
<text x="418" y="848.0" font-size="12" fill="#374151">Internal data stores (CRM, billing/CDR, offer catalog) and</text>
<text x="418" y="865.0" font-size="12" fill="#374151">external data stores (credit bureau, competitor pricing,</text>
<text x="418" y="882.0" font-size="12" fill="#374151">macroeconomic indicators).</text>
<text x="938" y="848.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">CRM / billing warehouse · credit bureau API</text>
<text x="938" y="865.0" font-size="11.5" font-family="'IBM Plex Mono',monospace" fill="#3E6D93">· competitor intelligence feed</text>
<line x1="0" y1="930.0" x2="1340" y2="930.0" stroke="#EDEEF1" stroke-width="1"/>
</svg>